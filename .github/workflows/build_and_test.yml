name: Build, Test & Coverage

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake 4.x
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.2'

      - name: Verify CMake version
        run: cmake --version

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Spark
        run: |
          curl -fL https://dlcdn.apache.org/spark/spark-4.0.3/spark-4.0.3-bin-hadoop3.tgz -o spark.tgz
          tar -xzf spark.tgz
          mv spark-4.0.3-bin-hadoop3 $HOME/spark

      - name: Start Spark Connect Server
        run: |
          $HOME/spark/sbin/start-connect-server.sh \
            --packages "org.apache.spark:spark-connect_2.13:4.0.3,io.delta:delta-spark_2.13:4.0.0,io.graphframes:graphframes-spark4_2.13:0.10.0,io.graphframes:graphframes-connect-spark4_2.13:0.10.0" \
            --conf "spark.connect.extensions.relation.classes=org.apache.spark.sql.graphframes.GraphFramesConnect" \
            --conf "spark.driver.extraJavaOptions=-Divy.cache.dir=/tmp -Divy.home=/tmp -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError" \
            --conf "spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension" \
            --conf "spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog" \
            --conf "spark.driver.memory=4g" \
            --conf "spark.executor.memory=4g" \
            --conf "spark.memory.fraction=0.8" \
            --conf "spark.memory.storageFraction=0.3" \
            --conf "spark.sql.shuffle.partitions=8" \
            --conf "spark.default.parallelism=8" \
            --conf "spark.driver.maxResultSize=2g"

          # wait for server
          sleep 15

      - name: Install dependencies
        run: |
          cd scripts
          chmod +x install-deps.sh
          ./install-deps.sh

      - name: Configure
        run: cmake --preset pr_pipeline

      - name: Build
        run: cmake --build --preset pr_pipeline

      - name: Test
        run: |
          export SPARK_REMOTE=sc://localhost
          ctest --preset test_pr_pipeline_spark_coverage

      - name: Generate Coverage (XML & HTML)
        working-directory: build
        run: |
          llvm-profdata-18 merge -sparse coverage/*.profraw -o coverage/merged.profdata

          TEST_BINARIES=$(find . -maxdepth 3 -type f -executable -name "*_test" | sed 's/^/-object=/' | tr '\n' ' ')

          llvm-cov-18 export \
            $TEST_BINARIES \
            -instr-profile=coverage/merged.profdata \
            -ignore-filename-regex='.*\.pb\.cc$|.*\.grpc\.pb\.cc$|.*\.h$' \
            -format=lcov > coverage.info

          pip install --quiet --break-system-packages lcov_cobertura
          lcov_cobertura coverage.info -o coverage.xml

          llvm-cov-18 show \
            $TEST_BINARIES \
            -instr-profile=coverage/merged.profdata \
            -ignore-filename-regex='.*\.pb\.cc$|.*\.grpc\.pb\.cc$|.*\.h$' \
            -format=html -output-dir=coverage_html

          llvm-cov-18 report \
            $TEST_BINARIES \
            -instr-profile=coverage/merged.profdata \
            -ignore-filename-regex='.*\.pb\.cc$|.*\.grpc\.pb\.cc$|.*\.h$' \
            | tee coverage_summary.txt

      - name: Check Coverage Threshold
        working-directory: build
        run: |
          LINE_PCT=$(grep TOTAL coverage_summary.txt | awk '{print $(NF-1)}' | tr -d '%')
          echo "Line coverage: ${LINE_PCT}%"
          awk -v pct="$LINE_PCT" 'BEGIN { exit (pct < 60) }'

      - name: Upload Coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: build/coverage.xml

      - name: Upload Coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage_html